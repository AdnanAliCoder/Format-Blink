name: Apply clean Format Blink source

on:
  push:
    paths:
      - ".release/READY"

permissions:
  contents: write

jobs:
  apply-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .release/part* > /tmp/source.b64
          base64 --decode /tmp/source.b64 > /tmp/source.tar.gz
          mkdir -p /tmp/source
          tar -xzf /tmp/source.tar.gz -C /tmp/source

      - name: Replace repository source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name .github \
            ! -name .release \
            -exec rm -rf {} +
          cp -a /tmp/source/. .
          rm -rf .bootstrap .bootstrap2 .release

      - name: Commit clean source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Replace packaged source with clean Format Blink code"
          git push origin HEAD:main
