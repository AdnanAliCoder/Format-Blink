name: Deploy Modal Tools Processor

on:
  push:
    branches:
      - main
    paths:
      - "modal_tools.py"
      - "processor/tools/**"
      - ".github/workflows/deploy-modal-tools.yml"
  workflow_dispatch:

concurrency:
  group: modal-tools-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check Modal credentials
        id: modal_auth
        shell: bash
        run: |
          if [[ -n "$MODAL_TOKEN_ID" && -n "$MODAL_TOKEN_SECRET" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Modal deployment skipped: add MODAL_TOKEN_ID and MODAL_TOKEN_SECRET as GitHub Actions secrets."
          fi

      - name: Set up Python
        if: steps.modal_auth.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Modal
        if: steps.modal_auth.outputs.ready == 'true'
        run: python -m pip install --upgrade modal

      - name: Deploy Format Blink tools service
        if: steps.modal_auth.outputs.ready == 'true'
        run: modal deploy modal_tools.py --strategy rolling
