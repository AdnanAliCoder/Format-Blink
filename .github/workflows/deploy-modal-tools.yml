name: Deploy Modal Tools Processor

on:
  push:
    branches:
      - main
    paths:
      - "modal_tools.py"
      - "processor/tools/**"
      - "scripts/verify-modal-tools.py"
      - ".github/workflows/deploy-modal-tools.yml"
  workflow_dispatch:

concurrency:
  group: modal-tools-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Require Modal credentials
        shell: bash
        run: |
          if [[ -z "$MODAL_TOKEN_ID" || -z "$MODAL_TOKEN_SECRET" ]]; then
            echo "::error::Modal was NOT deployed. Add MODAL_TOKEN_ID and MODAL_TOKEN_SECRET in repository Actions secrets, then rerun this workflow."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Modal
        run: python -m pip install --upgrade modal

      - name: Deploy FormatBlink tools service
        run: modal deploy modal_tools.py --strategy rolling

      - name: Verify deployed version and capabilities
        run: python scripts/verify-modal-tools.py
